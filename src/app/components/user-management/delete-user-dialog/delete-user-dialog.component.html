<h1 mat-dialog-title>Are you sure you want to delete the following users ?</h1>
<ul>
  @for (user of data.users; track user.username) {
  <li>{{ user.username }}{{ user.full_name ? ' (' + user.full_name + ')' : '' }}</li>
  }
</ul>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()" color="accent">No, cancel</button>
  <button mat-raised-button (click)="onDelete()" tabindex="2" class="add-project-button destructive-button">
    Yes, delete!
  </button>
</div>
