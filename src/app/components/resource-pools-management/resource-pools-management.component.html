@if (isReady()) {
<header class="resource-pools-management__header">
  <h1 class="resource-pools-management__title">Resource pools</h1>
</header>

<div class="resource-pools-management__toolbar">
  <form class="resource-pools-management__search-form">
    <mat-form-field appearance="fill" class="resource-pools-management__search" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        aria-label="Search resource pools by name"
        placeholder="Search resource pools by name"
        [value]="searchText()"
        (input)="searchText.set($event.target.value)"
      />
    </mat-form-field>
  </form>
  <div class="resource-pools-management__actions">
    <button
      mat-flat-button
      class="resource-pools-management__button resource-pools-management__button--destructive"
      [disabled]="selection.selected.length === 0"
      (click)="onDelete(selection.selected)"
    >
      Delete selected
    </button>
    <button mat-raised-button color="primary" class="resource-pools-management__button" (click)="addResourcePool()">
      Add resource pool
    </button>
  </div>
</div>

<div class="resource-pools-management__table-container">
  <table mat-table [dataSource]="dataSource | resourcePoolsFilter : searchText()" matSort #resourcePoolsSort="matSort">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef class="resource-pools-management__small-col">
        <mat-checkbox
          (change)="$event ? masterToggle() : null"
          [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row" class="resource-pools-management__small-col">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)"
        >
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>NAME</th>
      <td mat-cell *matCellDef="let element">
        <a
          class="resource-pools-management__link"
          [routerLink]="['/controller', controller.id, 'management', 'pools', element.resource_pool_id]"
        >
          {{ element.name }}
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="created_at">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>CREATION DATE</th>
      <td mat-cell *matCellDef="let element">{{ element.created_at }}</td>
    </ng-container>

    <ng-container matColumnDef="updated_at">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>LAST UPDATE</th>
      <td mat-cell *matCellDef="let element">{{ element.updated_at }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    #resourcePoolsPaginator="matPaginator"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Select page"
  >
  </mat-paginator>
</div>
} @else {
<div class="resource-pools-management__loader">
  <mat-spinner class="resource-pools-management__spinner"></mat-spinner>
</div>
}
