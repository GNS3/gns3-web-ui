<!-- Full-viewport leader-line overlay: a plain "this window describes this
     link" callout — dot at the link end, NOT a traffic-direction arrow. A
     PINNED snapshot's line is primary (same family as its --snapshot border),
     keeping the window→hop association visible while the snapshots sit in the
     dock row. -->
@if (anchored() && leader(); as l) {
<svg class="gns3-replay__leader gns3-replay__leader--pin" [style.z-index]="zVal()">
  <line class="gns3-replay__leader-line" [attr.x1]="l.x1" [attr.y1]="l.y1" [attr.x2]="l.x2" [attr.y2]="l.y2"></line>
  <circle class="gns3-replay__leader-dot" [attr.cx]="l.x2" [attr.cy]="l.y2" r="4"></circle>
</svg>
}

<div
  class="gns3-replay__window gns3-replay__window--snapshot"
  [class.gns3-replay__window--unanchored]="!anchored()"
  [class.gns3-replay__window--resizing]="resizing()"
  [class.gns3-replay__window--dragging]="dragging()"
  [style.left.px]="winLeft()"
  [style.top.px]="winTop()"
  [style.width.px]="winWidth()"
  [style.height.px]="winHeight()"
  [style.z-index]="zVal()"
  (mousedown)="windowFocused.emit()"
  mwlResizable
  [validateResize]="validate"
  [enableGhostResize]="false"
  (resizeStart)="onResizeStart()"
  (resizeEnd)="onResizeEnd($event)"
>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--top" mwlResizeHandle [resizeEdges]="{ top: true }"></div>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--right" mwlResizeHandle [resizeEdges]="{ right: true }"></div>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--bottom" mwlResizeHandle [resizeEdges]="{ bottom: true }"></div>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--left" mwlResizeHandle [resizeEdges]="{ left: true }"></div>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--top-left" mwlResizeHandle [resizeEdges]="{ top: true, left: true }"></div>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--top-right" mwlResizeHandle [resizeEdges]="{ top: true, right: true }"></div>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--bottom-left" mwlResizeHandle [resizeEdges]="{ bottom: true, left: true }"></div>
  <div class="gns3-replay__resize-handle gns3-replay__resize-handle--bottom-right" mwlResizeHandle [resizeEdges]="{ bottom: true, right: true }"></div>

  <div class="gns3-replay__window-header" (mousedown)="onHeaderMouseDown($event)">
    <mat-icon class="gns3-replay__window-icon">push_pin</mat-icon>
    <span class="gns3-replay__window-title">{{ pinned().frame.marker }}</span>
    <span class="gns3-replay__window-frame">#{{ pinned().frame.frame_number }}</span>
    @if (dragPinned()) {
      <button
        class="gns3-replay__window-reanchor"
        matTooltip="Dragged — click to return to the comparison row"
        (click)="reanchor()"
      >
        <mat-icon>anchor</mat-icon>
      </button>
    }
    <button
      class="gns3-replay__window-reanchor gns3-replay__window-close"
      matTooltip="Close this comparison window"
      (click)="unpinCurrent()"
    >
      <mat-icon>close</mat-icon>
    </button>
    @if (!anchored()) {
      <span class="gns3-replay__window-hint" matTooltip="This frame's link is not on the map">unanchored</span>
    }
  </div>

  <app-replay-detail-pane
    [frame]="pinned().frame"
    [state]="pinned().state"
    [changedPaths]="changedPaths()"
    missingAction="close"
    [(searchQuery)]="svc.searchQuery"
    (reload)="unpinCurrent()"
    (retry)="retryCurrentPin()"
    (applyFilter)="onPaneApplyFilter($event)"
    (applyLinkFilter)="onPaneApplyLinkFilter($event)"
  />
</div>
