<div class="gns3-replay__list">
  <!-- Sticky header: the Wireshark column rail. -->
  <div class="gns3-replay__list-head">
    <div class="gns3-replay__list-cols gns3-replay__list-cols--frames">
      <span class="gns3-replay__col-head">Time<button class="gns3-replay__col-grip" (mousedown)="startColDrag($event, 'time')" title="Drag to resize"></button></span>
      <span class="gns3-replay__col-head">Source<button class="gns3-replay__col-grip" (mousedown)="startColDrag($event, 'src')" title="Drag to resize"></button></span>
      <span class="gns3-replay__col-head">Destination<button class="gns3-replay__col-grip" (mousedown)="startColDrag($event, 'dst')" title="Drag to resize"></button></span>
      <span class="gns3-replay__col-head">Proto<button class="gns3-replay__col-grip" (mousedown)="startColDrag($event, 'proto')" title="Drag to resize"></button></span>
      <span class="gns3-replay__col-head">Len<button class="gns3-replay__col-grip" (mousedown)="startColDrag($event, 'len')" title="Drag to resize"></button></span>
      <span>Info</span>
    </div>
  </div>

  <!-- The scrollport. Rows are a WINDOWED slice: spacers above/below preserve
       the full scroll height while only viewport ± buffer rows mount (see the
       component docblock). -->
  <div class="gns3-replay__list-scroll" #scroller (scroll)="onScroll($event)">
    @if (frameSlice(); as s) {
      <div class="gns3-replay__list-pad" [style.height.px]="s.top"></div>
      @for (row of s.rows; track row.index) {
        <div
          class="gns3-replay__row"
          [attr.data-index]="row.index"
          [class.gns3-replay__row--selected]="row.index === svc.currentFrameIndex()"
          [style.--pkt-bg]="row.frame.bg ? '#' + row.frame.bg : null"
          [style.--pkt-fg]="row.frame.fg ? '#' + row.frame.fg : null"
          role="row"
          tabindex="0"
          (click)="svc.setCurrentIndex(row.index)"
          (keydown)="onRowKey($event)"
          [title]="row.frame.info ?? ''"
        >
          <span class="gns3-replay__cell gns3-replay__cell--time">{{ row.time }}</span>
          <span class="gns3-replay__cell gns3-replay__cell--addr">{{ row.frame.src ?? '—' }}</span>
          <span class="gns3-replay__cell gns3-replay__cell--addr">{{ row.frame.dst ?? '—' }}</span>
          <span class="gns3-replay__cell gns3-replay__cell--proto">{{ row.frame.proto ?? '—' }}</span>
          <span class="gns3-replay__cell gns3-replay__cell--len">{{ row.frame.len }}</span>
          <span class="gns3-replay__cell gns3-replay__cell--info">{{ row.frame.info ?? '' }}</span>
        </div>
      }
      <div class="gns3-replay__list-pad" [style.height.px]="s.bottom"></div>
    }
  </div>
</div>
