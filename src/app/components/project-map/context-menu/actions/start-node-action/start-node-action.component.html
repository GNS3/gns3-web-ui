@if (isNodeWithStoppedStatus) {
<button mat-menu-item (click)="startNodes()">
  <mat-icon>play_arrow</mat-icon>
  <span>Start</span>
</button>
} @else if (hasMissingImageNodes) {
<button mat-menu-item disabled matTooltip="A compatible image is required to start this node">
  <mat-icon>play_arrow</mat-icon>
  <span>Start</span>
</button>
}
