<div class="menu-button-group">
  @if (!readonly) {
  <button
    *appHasProjectPrivilege="'Node.Console'"
    matTooltip="Console connect to all nodes"
    matTooltipClass="custom-tooltip"
    mat-icon-button
    (click)="startConsoleForAllNodes()"
    class="menu-button"
  >
    <mat-icon>web_asset</mat-icon>
  </button>
  <button
    *appHasProjectPrivilege="'Node.PowerMgmt'"
    matTooltip="Start/Resume all nodes"
    matTooltipClass="custom-tooltip"
    mat-icon-button
    (click)="confirmControlsActions('start')"
    class="menu-button"
  >
    <mat-icon>play_arrow</mat-icon>
  </button>
  <button
    *appHasProjectPrivilege="'Node.PowerMgmt'"
    matTooltip="Suspend all nodes"
    matTooltipClass="custom-tooltip"
    mat-icon-button
    (click)="confirmControlsActions('suspend')"
    class="menu-button"
  >
    <mat-icon>pause</mat-icon>
  </button>
  <button
    *appHasProjectPrivilege="'Node.PowerMgmt'"
    matTooltip="Stop all nodes"
    matTooltipClass="custom-tooltip"
    mat-icon-button
    (click)="confirmControlsActions('stop')"
    class="menu-button"
  >
    <mat-icon>stop</mat-icon>
  </button>
  <button
    *appHasProjectPrivilege="'Node.PowerMgmt'"
    matTooltip="Reload all nodes"
    matTooltipClass="custom-tooltip"
    mat-icon-button
    (click)="confirmControlsActions('reload')"
    class="menu-button"
  >
    <mat-icon>replay</mat-icon>
  </button>

  <button
    *appHasProjectPrivilege="'Node.Console'"
    matTooltip="Reset all console connections"
    matTooltipClass="custom-tooltip"
    mat-icon-button
    (click)="confirmControlsActions('reset')"
    class="menu-button"
  >
    <mat-icon>compare_arrows</mat-icon>
  </button>
  <span class="configuration-separator" aria-hidden="true"></span>
  <button
    *appHasProjectPrivilege="['Project.Modify', 'Node.Modify', 'Node.Console']"
    matTooltip="Export all configurations"
    matTooltipClass="custom-tooltip"
    aria-label="Export all configurations"
    mat-icon-button
    class="menu-button"
    (click)="exportAllConfigurations()"
    [disabled]="configurationBusy()"
  >
    <mat-icon>save_alt</mat-icon>
  </button>
  <button
    *appHasProjectPrivilege="['Project.Modify', 'Node.Modify', 'Node.Console']"
    matTooltip="Wipe all nodes"
    matTooltipClass="custom-tooltip"
    aria-label="Wipe all nodes"
    mat-icon-button
    class="menu-button"
    (click)="wipeAllNodes()"
    [disabled]="configurationBusy()"
  >
    <mat-icon>delete_sweep</mat-icon>
  </button>
  }
</div>
