<h1 mat-dialog-title>Change symbol for node: {{ node.name }}</h1>

<div class="modal-form-container">
  <app-symbols [controller]="controller" [symbol]="symbol" (symbolChanged)="symbolChanged($event)"></app-symbols>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onCloseClick()" color="accent">Cancel</button>
  <button mat-button (click)="onSelectClick()" tabindex="2" mat-raised-button color="primary" [disabled]="isApplying()">
    @if (isApplying()) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      Apply
    }
  </button>
</div>
