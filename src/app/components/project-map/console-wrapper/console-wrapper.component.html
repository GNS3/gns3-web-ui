<!-- Console Wrapper with RxJS drag handling -->
<div
  #consoleWrapper
  class="consoleWrapper"
  [ngClass]="{
    lightTheme: isLightThemeEnabled(),
    'console-active': isConsoleActive(),
    'is-minimized': isMinimized(),
    'is-dragging': isDragging(),
    'is-resizing': isResizing()
  }"
  [style.z-index]="zIndex()"
  (mousedown)="onWindowFocus()"
  mwlResizable
  [validateResize]="validate"
  [enableGhostResize]="false"
  (resizeStart)="onResizingStart()"
  (resizing)="onResizing($event)"
  (resizeEnd)="onResizeEnd($event)"
  tabindex="0"
  (click)="onConsoleActivate()"
  (focus)="onConsoleActivate()"
>
  @if (!isMinimized()) {
  <!-- Edge handles -->
  <app-floating-window-resize-handles />
  }

  <!-- Console Content -->
  <div class="console-content">
    <!-- Devices Panel -->
    <app-console-devices-panel
      [isLightTheme]="isLightThemeEnabled()"
      (deviceSelected)="onDeviceSelected($event)"
    ></app-console-devices-panel>

    <!-- Console Area -->
    <div class="console-area">
      <div class="consoleHeader">
        <mat-tab-group
          class="console-wrapper__tabs"
          [selectedIndex]="selected.value"
          (selectedIndexChange)="selected.setValue($event)"
        >
          @for (node of nodes; track $index; let index = $index) {
          <mat-tab>
            <ng-template mat-tab-label>
              <span class="tab-label-spacer"></span>
              <span class="tab-label-text">{{ node.name }}</span>
              <button class="tab-close-btn" (mousedown)="$event.stopPropagation()" (click)="removeTab(index)" title="Close" aria-label="Close tab">
                <mat-icon>close</mat-icon>
              </button>
            </ng-template>
          </mat-tab>
          }

          <mat-tab>
            <ng-template mat-tab-label>
              <span class="tab-label-text">GNS3 console</span>
            </ng-template>
          </mat-tab>
        </mat-tab-group>

        <div class="console-header-actions">
          <button
            mat-icon-button
            class="header-action-btn"
            (mousedown)="$event.stopPropagation()"
            (click)="toggleSettingsPanel()"
            [class.active]="showSettingsPanel()"
            title="Terminal settings"
            aria-label="Terminal settings"
          >
            <mat-icon>tune</mat-icon>
          </button>
          <button
            mat-icon-button
            class="header-action-btn"
            (mousedown)="$event.stopPropagation()"
            (click)="toggleMaximize()"
            [title]="isMaximized() ? 'Restore' : 'Maximize height'"
            [attr.aria-label]="isMaximized() ? 'Restore console height' : 'Maximize console height'"
          >
            <mat-icon>{{ isMaximized() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
          </button>
          <button mat-icon-button class="header-action-btn" (mousedown)="$event.stopPropagation()" (click)="minimize(true)" aria-label="Minimize console">
            <mat-icon>remove</mat-icon>
          </button>
          <button mat-icon-button class="header-action-btn header-action-btn--close" (mousedown)="$event.stopPropagation()" (click)="close()" aria-label="Close console">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>

      <!-- Settings panel (shared with the standalone console page) -->
      @if (showSettingsPanel()) {
      <app-terminal-settings-panel
        [style.--gns3-terminal-settings-top]="'40px'"
        [style.--gns3-terminal-settings-right]="'15px'"
        (closed)="closeSettingsPanel()"
      />
      }

      <app-log-console [hidden]="!(selected.value === nodes.length)" [controller]="controller()" [project]="project()">
      </app-log-console>

      @for (node of nodes; track $index; let index = $index) {
      <app-web-console [hidden]="!(selected.value === index)" [controller]="controller()" [node]="nodes[index]">
      </app-web-console>
      }
    </div>
  </div>
</div>
