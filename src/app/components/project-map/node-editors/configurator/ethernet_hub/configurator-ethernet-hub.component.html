<div mat-dialog-title class="node-config__header">
  <h1 class="node-config__title">Configure Node <span aria-hidden="true">—</span> Ethernet hub {{ name }}</h1>
  <button
    mat-icon-button
    type="button"
    class="node-config__close"
    aria-label="Close node configuration"
    (click)="onCancelClick()"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="modal-form-container">
  @if (isLoading()) {
  <div class="configurator-dialog-loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  } @else {
  <div class="node-config__single-tab" role="tablist" aria-label="Node configuration sections">
    <div role="tab" aria-selected="true">
      <span class="node-config__tab-label"><mat-icon>tune</mat-icon>General</span>
    </div>
  </div>
  <div class="content">
    <div class="default-content">
      <mat-card class="matCard">
        <h2 class="node-config__section-heading">General settings</h2>
        <div class="form-container">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-field">
            <mat-label>Name</mat-label>
            <input matInput type="text" [value]="nodeName()" (input)="nodeName.set($event.target.value)" />
          </mat-form-field>

          <div class="gns3-chip-field">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              subscriptSizing="dynamic"
              class="form-field tags-field"
            >
              <mat-label>Tags</mat-label>

              <input
                matInput
                placeholder="Add tags"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                (matChipInputTokenEnd)="addTag($event)"
              />
            </mat-form-field>
            <mat-chip-grid
              #chipList
              class="gns3-chip-field__values"
              [class.gns3-chip-field__values--empty]="(node?.tags?.length ?? 0) === 0"
              aria-label="Tags"
            >
              @for (tag of node?.tags; track tag) {
              <mat-chip-row [editable]="false" [attr.title]="tag" (removed)="removeTag(tag)">
                {{ tag }}
                <button matChipRemove type="button" [attr.aria-label]="'Remove tag ' + tag">
                  <mat-icon>cancel</mat-icon>
                </button>
              </mat-chip-row>
              }
            </mat-chip-grid>
          </div>

          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="form-field">
            <mat-label>Number of ports</mat-label>
            <input
              matInput
              type="text"
              [value]="nodeNumberOfPorts()"
              (input)="nodeNumberOfPorts.set($event.target.value)"
            />
          </mat-form-field>
        </div>
      </mat-card>
    </div>
  </div>
  }
</div>

<div mat-dialog-actions>
  <button mat-button (click)="onCancelClick()" color="accent">Cancel</button>
  <button
    mat-button
    (click)="onSaveClick()"
    tabindex="2"
    mat-raised-button
    color="primary"
    [disabled]="isApplying() || isLoading()"
  >
    @if (isApplying()) {
    <mat-spinner diameter="20"></mat-spinner>
    } @else { Apply }
  </button>
</div>
