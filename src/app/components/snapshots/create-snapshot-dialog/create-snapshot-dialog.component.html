<h1 mat-dialog-title>Create snapshot</h1>

<div mat-dialog-content>
  <form [formGroup]="inputForm" class="gns3-form-stack">
    <mat-form-field class="name-input" subscriptSizing="dynamic">
      <input matInput tabindex="1" formControlName="snapshotName" placeholder="Name" />
    </mat-form-field>
    <mat-form-field subscriptSizing="dynamic">
      <textarea
        matInput
        tabindex="2"
        formControlName="snapshotDescription"
        placeholder="Description (optional)"
        rows="3"
      ></textarea>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button (click)="onAddClick()" tabindex="3" mat-raised-button color="primary">Add</button>
</div>
