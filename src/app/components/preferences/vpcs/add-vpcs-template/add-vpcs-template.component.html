<div class="vpcs-add template-wizard">
  <header class="vpcs-add__header template-wizard__header">
    @if (controller) {
    <button
      class="vpcs-add__back-btn template-wizard__back"
      (click)="goBack()"
      mat-icon-button
      aria-label="Back to VPCS templates"
    >
      <mat-icon>arrow_back</mat-icon>
    </button>
    }
    <div class="template-wizard__heading">
      <h1 class="vpcs-add__title template-wizard__title">New VPCS node template</h1>
    </div>
  </header>

  <main class="vpcs-add__content template-wizard__body">
    <div class="template-wizard__single-layout">
      <aside class="template-wizard__single-nav" aria-label="Template creation steps">
        <div class="template-wizard__single-step template-wizard__single-step--detailed">
          <span class="template-wizard__single-step-index">1</span>
          <span class="template-wizard__step-label">
            <mat-icon>description</mat-icon>
            <span class="template-wizard__step-label-text">
              <span class="template-wizard__step-label-title">Template info</span>
              <span class="template-wizard__step-label-description">Basic details and name</span>
            </span>
          </span>
        </div>
      </aside>
      <div class="template-wizard__single-content">
        <section class="vpcs-add__form-card template-wizard__panel">
          <section class="template-wizard__section">
            <h2 class="template-wizard__section-title">Template information</h2>
            <p class="template-wizard__section-copy">Choose a name and an optional usage note for your template.</p>
            <mat-radio-group class="vpcs-add__radio-group">
              <mat-radio-button class="vpcs-add__radio" value="1" (click)="setControllerType('local')" [checked]="true">
                Run the VPCS node locally
              </mat-radio-button>
            </mat-radio-group>

            <form [formGroup]="templateNameForm" class="vpcs-add__form">
              <mat-form-field appearance="outline" class="vpcs-add__field template-wizard__field">
                <mat-label>Template name</mat-label>
                <input matInput required formControlName="templateName" type="text" placeholder="Template name" />
              </mat-form-field>
            </form>
            <app-netmiko-device-type-select
              [(value)]="netmikoDeviceType"
              [controller]="controller"
              appearance="outline"
              class="vpcs-add__field"
            />
            <app-template-info-fields [(usage)]="usage" [(symbol)]="symbol"></app-template-info-fields>
          </section>
        </section>
      </div>
    </div>

    <div class="vpcs-add__actions template-wizard__actions">
      <button mat-stroked-button class="vpcs-add__cancel-btn" (click)="goBack()">Cancel</button>
      <button
        mat-raised-button
        color="primary"
        class="vpcs-add__submit-btn"
        [disabled]="templateNameForm.invalid || !controller"
        (click)="addTemplate()"
      >
        Create template
      </button>
    </div>
  </main>
</div>
