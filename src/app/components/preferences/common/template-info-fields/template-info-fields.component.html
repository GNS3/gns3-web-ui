<div class="template-info-fields">
  <mat-form-field appearance="outline" class="template-wizard__field">
    <mat-label>Usage notes</mat-label>
    <textarea
      matInput
      rows="3"
      [value]="usage()"
      (input)="usage.set($event.target.value)"
      placeholder="Optional notes that help identify and use this template"
    ></textarea>
  </mat-form-field>

  <div class="template-info-fields__symbols">
    <span class="template-info-fields__label">Template icon</span>
    <div class="template-info-fields__options" role="radiogroup" aria-label="Template icon">
      @for (option of symbolOptions; track option.value) {
      <button
        mat-stroked-button
        type="button"
        class="template-info-fields__option"
        [class.template-info-fields__option--selected]="symbol() === option.value"
        [attr.aria-pressed]="symbol() === option.value"
        (click)="symbol.set(option.value)"
      >
        <mat-icon>{{ option.icon }}</mat-icon>
        <span>{{ option.label }}</span>
      </button>
      }
    </div>
  </div>
</div>
