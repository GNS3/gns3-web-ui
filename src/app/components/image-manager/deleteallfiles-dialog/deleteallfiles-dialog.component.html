<div class="delete-files">
  @if (!isUsedFiles) {
  <h1 mat-dialog-title class="delete-files__title delete-files__title--center">Deleting images</h1>
  <mat-dialog-content class="delete-files__content delete-files__content--center">
    <mat-spinner color="accent"></mat-spinner>
  </mat-dialog-content>
  } @if (isUsedFiles) {
  <mat-dialog-content class="delete-files__content">
    @if (failedMessages.length > 0) {
    <h5 class="delete-files__error-title">The following images can't be deleted:</h5>
    <ul class="delete-files__list">
      @for (message of failedMessages; track $index) {
      <li class="delete-files__list-item delete-files__list-item--error">{{ message }}</li>
      }
    </ul>
    } @if (deletedCount > 0) {
    <h5 class="delete-files__success-title">{{ deletedCount }} Images deleted successfully.</h5>
    }
  </mat-dialog-content>
  <mat-dialog-actions class="delete-files__actions">
    <button mat-raised-button color="primary" (click)="dialogRef.close(false)">Close</button>
  </mat-dialog-actions>
  }
</div>
