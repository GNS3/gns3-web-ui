<h1 mat-dialog-title>{{ title }}</h1>
<div mat-dialog-content>
  <div class="progress-dialog__body">
    <mat-spinner diameter="36" />
    <div class="progress-dialog__text">
      <p class="progress-dialog__message">{{ message }}</p>
      @if (backgroundHint) {
      <p class="progress-dialog__hint">{{ backgroundHint }}</p>
      }
    </div>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onDismissClick()" tabindex="-1">Continue in background</button>
</div>
